# CI for the ODIR Brain (slice A2) and the role-contract templates (slice A3). Runs on every push
# and pull request. Read-only token, no secrets, no deploys.
# Node 22: `node --test "test/*.test.js"` needs glob support (Node 21+); Node 20 finds no files.
# A3 adds: the template tests, the check-and-render gate for every role x base pair that exists,
# and the check that each role commit touches only its own folder.
name: brain-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Brain tests
        working-directory: brain
        run: npm test
      - name: Schema gate
        run: node brain/bin/check-schemas.mjs
      - name: Adapter tests
        working-directory: adapter
        run: npm test
      - name: Template tests
        working-directory: resolver
        run: npm test
      - name: Templates — check and render every role x base pair
        run: node resolver/bin/render-all.mjs
      - name: Role commits touch only their own folder
        # Pull request: every commit in the PR. Push: the commits this push added (on main too, so a
        # squash or a direct push is checked after the fact); a new branch: everything not on main.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"; HEAD="$(git rev-parse HEAD)"
          else
            BASE="$(git merge-base origin/main HEAD)"; HEAD="$(git rev-parse HEAD)"
          fi
          node resolver/bin/check-role-commits.mjs --base "$BASE" --head "$HEAD"
